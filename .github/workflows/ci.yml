name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_CONFIG: .gitleaks.toml

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m py_compile app.py

  oidc:
    # CI sin secretos: el job pide un token OIDC de corta vida en vez de usar claves guardadas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pedir el token OIDC y mostrar solo los claims del payload
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          # Solo el payload (parte 2 del JWT); el token completo y la firma nunca se imprimen
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps(claims, indent=2, sort_keys=True))
          PY
      - name: Verificar el token OIDC (firma RS256 contra el JWKS de GitHub, claims) y canjearlo en una nube simulada
        # moto local en el runner: sin AWS real. El token nunca se imprime.
        run: |
          python3 -m pip install --quiet "moto[server]==5.2.5" "boto3==1.44.3" "pyjwt[crypto]==2.15.1"
          python3 -m moto.server -p 5000 > /dev/null 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:5000/moto-api/ > /dev/null && break; sleep 0.5; done
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          OIDC_TOKEN="$TOKEN" MOTO_ENDPOINT=http://127.0.0.1:5000 python3 ci/oidc/oidc_verificar.py
