name: Centinela

# Bot de rastreo de secretos del laboratorio (tools/centinela/centinela.py, versión 2.2.2).
# N1 (secretos en todo el historial) y N3 (auditoría de workflows); N2 no corre en CI (necesita Ollama).
# Compuerta: el job falla si hay hallazgos de severidad alta o crítica, o si el bot falla (exit 2).
# El SARIF se sube a code scanning aunque la compuerta falle, para ver los hallazgos en Security.
#
# R22, PR que se aprueba a sí mismo: en un pull_request, el bot y .centinela-ignorar se toman de la
# rama BASE, no del PR. Así, un PR no puede agregar la huella de su propio secreto a
# .centinela-ignorar ni cambiar el bot para que lo deje pasar.
# Riesgo residual: en pull_request, GitHub ejecuta ESTE archivo tal como viene en el PR, así que un
# PR que edite este workflow puede quitar el paso. Solo lo frena la revisión humana de .github/,
# tools/ y .centinela-ignorar, y el ruleset de main pide 0 aprobaciones porque el repo tiene un solo
# dueño: en la práctica, el dueño puede cambiar la compuerta con un PR propio.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  centinela:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: con un clon superficial el bot sale con 2
          persist-credentials: false

      - name: En un PR, usar el bot y las exclusiones de la rama base
        if: github.event_name == 'pull_request'
        env:
          RAMA_BASE: ${{ github.base_ref }} # dato del evento: por env, nunca interpolado en run
        run: |
          git show "origin/${RAMA_BASE}:tools/centinela/centinela.py" > "$RUNNER_TEMP/centinela.py"
          if git show "origin/${RAMA_BASE}:.centinela-ignorar" > "$RUNNER_TEMP/ignorar" 2>/dev/null; then
            cp "$RUNNER_TEMP/ignorar" .centinela-ignorar
          else
            rm -f .centinela-ignorar
          fi
          echo "BOT=$RUNNER_TEMP/centinela.py" >> "$GITHUB_ENV"
          echo "Bot y exclusiones tomados de origin/${RAMA_BASE}"

      - name: Escanear con centinela (N1 y N3)
        id: escaneo
        continue-on-error: true
        run: python3 "${BOT:-tools/centinela/centinela.py}" . --niveles 1,3 --falla-en alta --salida centinela-salida

      - name: Comprobar que el SARIF no lleva ningún valor completo
        # Vuelve a correr N1 en memoria y busca cada valor detectado dentro del SARIF.
        # Solo deben aparecer el valor enmascarado y su huella SHA-256.
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, os.path.dirname(os.environ.get("BOT", "tools/centinela/centinela.py")))
          import centinela
          valores = [h["_valor"] for h in centinela.escanear_repo(".")]
          texto = open("centinela-salida/reporte.sarif", encoding="utf-8").read()
          fugas = sum(1 for v in valores if len(v) >= 8 and v in texto)
          print(f"{len(valores)} valores revisados, {fugas} fugas en el SARIF")
          sys.exit(1 if fugas else 0)
          PY

      - name: Subir el SARIF a code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: centinela-salida/reporte.sarif
          category: centinela

      - name: Compuerta
        if: steps.escaneo.outcome == 'failure'
        run: |
          echo "centinela encontró hallazgos de severidad alta o crítica (o falló): ver la pestaña Security"
          exit 1
